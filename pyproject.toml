[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-offline"
version = "0.2.0"
description = "Offline Bitcoin metadata investigation workbench"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<1.9", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "defusedxml>=0.7,<1", "maxminddb>=2.6,<4", "cryptography>=43", "ijson>=3.3,<4", "reportlab>=4.2,<5", "shap>=0.46,<0.51", "torch>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
chimera = "chimera.cli:main"

[tool.setuptools.package-data]
chimera = ["static/*"]

[tool.setuptools.packages.find]
include = ["chimera*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
