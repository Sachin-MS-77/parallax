name: PARALLAX Linux screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'parallax/**'
      - 'scripts/capture_linux_demo.py'
      - '.github/workflows/linux-demo.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]' playwright
          python -m playwright install --with-deps chromium
      - name: Test and generate demo
        run: |
          python -m pytest -q
          parallax demo --data data/linux-demo --entities 160
      - name: Start server and capture
        run: |
          mkdir -p artifacts/linux-demo
          parallax serve --data data/linux-demo --port 8877 > artifacts/linux-demo/server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8877/api/summary > /dev/null; then break; fi
            sleep 1
          done
          python scripts/capture_linux_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallax-linux-demo
          path: artifacts/linux-demo/
          retention-days: 14
