name: CHIMERA verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU torch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install '.[test]'
      - name: Tests
        run: python -m pytest -q
      - name: End-to-end synthetic demo
        run: parallax demo --data data/ci-demo --entities 80
